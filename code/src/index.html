<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeaveDesk</title>
    <script>
      const themeBridge = window.leaveDesk;
      const preference = themeBridge?.initialTheme ?? "system";
      const dark = preference === "dark" || (preference === "system" && themeBridge?.initialSystemDark);
      document.documentElement.dataset.bsTheme = dark ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
